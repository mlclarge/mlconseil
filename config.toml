baseURL = "/"
languageCode = "fr-FR"
title = "MLConseil – Formation Marketing Digital | Google Ads & SEO"
theme = "papermod"
enableRobots = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[permalinks]
  pages = "/:slug/"

[pagination]
pagerSize = 10

[params]
    description = "Formations Google Ads et SEO personnalisées avec Maurice Largeron, consultant formateur certifié Google Partner depuis 2011."
    author = "Maurice Largeron"
    defaultTheme = "auto"
    ShowWordCount = false
    ShowReadingTime = false
    homeInfoParams = false

[outputs]
    home = ["HTML", "RSS", "JSON"]

[taxonomies]
    category = "categories"
    tag = "tags"

[[menu.main]]
    name = "Accueil"
    url = "/"
    weight = 1

[[menu.main]]
    name = "Formation Google Ads"
    url = "/formation-google-ads/"
    weight = 2

[[menu.main]]
    name = "Formation SEO"
    url = "/formation-referencement-a-bordeaux/"
    weight = 3

[[menu.main]]
    name = "Évaluations"
    url = "/evaluation-avis-temoignage/"
    weight = 4

[[menu.main]]
    name = "Blog"
    url = "/blog/"
    weight = 5

[[menu.main]]
    name = "Recherche"
    url = "/search/"
    weight = 6
